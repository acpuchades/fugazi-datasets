name: macro-global-indices-1d
description: >
  Major global equity indices plus emerging markets, daily bars.
  Useful for cross-market momentum and macro regime strategies.
interval: 1d
overlays:
  vr20: !variance_ratio { period: 20, lag: 5 }
  autocorr20: !correlation
    lhs: !roc { periods: 1 }
    rhs: !lag { source: !roc { periods: 1 }, periods: 1 }
    period: 20
  rvol20: !garman_klass { period: 20 }
  kurt60: !kurtosis { period: 60 }
  sp500_sharpe252: !sharpe
    strategy:
      symbol: "^GSPC"
      long:
        enter: !value true
    period: 252
    bars_per_year: 252.0
sources:
  - yfinance:
      symbols:
        - "^GSPC"  # S&P 500
        - "^NDX"   # Nasdaq 100
        - "^FTSE"  # FTSE 100
        - "^GDAXI" # DAX
        - "^N225"  # Nikkei 225
        - "^HSI"   # Hang Seng
        - "^BVSP"  # Bovespa
        - EEM      # Emerging Markets ETF (iShares)
