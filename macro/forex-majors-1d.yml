name: macro-forex-majors-1d
description: >
  G10 FX major pairs, daily bars (USD base or quote).
  Useful for carry strategies and macro FX trend following.
interval: 1d
sources:
  - yfinance:
      symbols:
        - "EURUSD=X"
        - "GBPUSD=X"
        - "JPY=X"
        - "AUDUSD=X"
        - "CAD=X"
        - "CHF=X"
        - "NZD=X"
