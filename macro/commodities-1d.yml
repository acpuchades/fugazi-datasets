name: macro-commodities-1d
description: >
  Commodity ETFs across metals, energy and agriculture, daily bars.
  Useful for inflation regime strategies and cross-asset diversification.
interval: 1d
overlays:
  vr20: !variance_ratio { period: 20, lag: 5 }
  autocorr20: !correlation
    lhs: !roc { periods: 1 }
    rhs: !lag { source: !roc { periods: 1 }, periods: 1 }
    period: 20
  rvol20: !garman_klass { period: 20 }
  kurt60: !kurtosis { period: 60 }
  gld_sharpe252: !sharpe
    strategy:
      symbol: GLD
      long:
        enter: !value true
    period: 252
    bars_per_year: 252.0
sources:
  - yfinance:
      symbols:
        - GLD   # Gold
        - SLV   # Silver
        - USO   # Crude Oil
        - UNG   # Natural Gas
        - DBA   # Agriculture (broad)
        - PDBC  # Diversified commodities (Invesco)
        - CORN  # Corn
        - WEAT  # Wheat
