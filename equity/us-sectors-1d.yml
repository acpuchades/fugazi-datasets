name: equity-us-sectors-1d
description: >
  US equity sector ETFs (SPDR / Select Sector) plus the S&P 500 benchmark,
  daily bars. Covers all 11 GICS sectors; useful for sector rotation,
  relative-strength and macro regime strategies.
interval: 1d
overlays:
  vr20: !variance_ratio { period: 20, lag: 5 }
  autocorr20: !correlation
    lhs: !roc { periods: 1 }
    rhs: !lag { source: !roc { periods: 1 }, periods: 1 }
    period: 20
  rvol20: !garman_klass { period: 20 }
  kurt60: !kurtosis { period: 60 }
  spy_sharpe252: !sharpe
    strategy:
      symbol: SPY
      long:
        enter: !value true
    period: 252
    bars_per_year: 252.0
sources:
  - yfinance:
      symbols:
        - SPY   # S&P 500 benchmark
        - XLK   # Technology
        - XLF   # Financials
        - XLE   # Energy
        - XLV   # Health Care
        - XLU   # Utilities
        - XLI   # Industrials
        - XLP   # Consumer Staples
        - XLY   # Consumer Discretionary
        - XLRE  # Real Estate
        - XLC   # Communication Services
        - XLB   # Materials
