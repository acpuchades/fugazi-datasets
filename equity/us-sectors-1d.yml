name: equity-us-sectors-1d
description: >
  US equity sector ETFs (SPDR) plus SPY as benchmark, daily bars.
  Covers all 11 GICS sectors; useful for sector rotation strategies.
interval: 1d
sources:
  - provider: yfinance
    symbols:
      - SPY   # S&P 500 benchmark
      - XLK   # Technology
      - XLF   # Financials
      - XLE   # Energy
      - XLV   # Health Care
      - XLU   # Utilities
      - XLI   # Industrials
      - XLP   # Consumer Staples
      - XLY   # Consumer Discretionary
      - XLRE  # Real Estate
      - XLC   # Communication Services
      - XLB   # Materials
