name: equity-us-factors-1d
description: >
  US equity factor ETFs (iShares + MSCI), daily bars.
  Covers the canonical Fama-French factors plus quality and low-vol;
  useful for factor timing and risk decomposition.
interval: 1d
overlays:
  vr20: !variance_ratio { period: 20, lag: 5 }
  autocorr20: !correlation
    lhs: !roc { periods: 1 }
    rhs: !lag { source: !roc { periods: 1 }, periods: 1 }
    period: 20
  rvol20: !garman_klass { period: 20 }
  kurt60: !kurtosis { period: 60 }
sources:
  - yfinance:
      symbols:
        - MTUM  # Momentum
        - VLUE  # Value
        - QUAL  # Quality
        - USMV  # Min Volatility
        - SIZE  # Size
        - IWF   # Growth (Russell 1000 Growth)
        - IWD   # Value (Russell 1000 Value)
