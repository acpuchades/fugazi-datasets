name: crypto-large-cap-4h
description: >
  Large-cap crypto spot pairs vs. USDT on Binance, 4-hour bars.
  Same universe as large-cap-1d at higher resolution for intraday strategies.
interval: 4h
overlays:
  vr20: !variance_ratio { period: 20, lag: 5 }
  autocorr20: !correlation
    lhs: !roc { periods: 1 }
    rhs: !lag { source: !roc { periods: 1 }, periods: 1 }
    period: 20
  rvol20: !garman_klass { period: 20 }
  kurt60: !kurtosis { period: 60 }
  btc_sharpe180: !sharpe
    strategy:
      symbol: BTCUSDT
      long:
        enter: !value true
    period: 180
    bars_per_year: 2190.0
sources:
  - binance:
      symbols:
        - BTCUSDT
        - ETHUSDT
        - SOLUSDT
        - BNBUSDT
        - AVAXUSDT
        - LINKUSDT
        - ADAUSDT
        - DOTUSDT
        - XRPUSDT
