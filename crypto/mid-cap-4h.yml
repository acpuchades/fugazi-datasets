name: crypto-mid-cap-4h
description: >
  Mid-cap crypto spot pairs vs. USDT on Binance, 4-hour bars.
  Tokens ranked 10-19 by market cap (non-stable, Binance-listed),
  complementing large-cap-4h for cross-sectional factor strategies.
  Selection is maintained automatically via `make update-selections`.
interval: 4h
coingecko_ids:
  XMRUSDT: monero
  LINKUSDT: chainlink
  XLMUSDT: stellar
  BCHUSDT: bitcoin-cash
  GRAMUSDT: the-open-network
  LTCUSDT: litecoin
  HBARUSDT: hedera-hashgraph
  SHIBUSDT: shiba-inu
  AVAXUSDT: avalanche-2
  SUIUSDT: sui
sources:
  - binance:
      symbols:
        - XMRUSDT
        - LINKUSDT
        - XLMUSDT
        - BCHUSDT
        - GRAMUSDT
        - LTCUSDT
        - HBARUSDT
        - SHIBUSDT
        - AVAXUSDT
        - SUIUSDT
