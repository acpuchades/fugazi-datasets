name: crypto-large-cap-1d
description: >
  Large-cap crypto spot pairs vs. USDT on Binance, daily bars.
  Covers the nine largest tokens by market cap with sufficient liquidity
  for most trend-following and cross-asset strategies.
interval: 1d
coingecko_ids:
  BTCUSDT: bitcoin
  ETHUSDT: ethereum
  BNBUSDT: binancecoin
  XRPUSDT: ripple
  SOLUSDT: solana
  TRXUSDT: tron
  DOGEUSDT: dogecoin
  ZECUSDT: zcash
  ADAUSDT: cardano
sources:
  - binance:
      symbols:
        - BTCUSDT
        - ETHUSDT
        - BNBUSDT
        - XRPUSDT
        - SOLUSDT
        - TRXUSDT
        - DOGEUSDT
        - ZECUSDT
        - ADAUSDT
