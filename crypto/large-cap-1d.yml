name: crypto-large-cap-1d
description: >
  Large-cap crypto spot pairs vs. USDT on Binance, daily bars.
  Covers the nine largest tokens by market cap with sufficient liquidity
  for most trend-following and cross-asset strategies.
interval: 1d
sources:
  - binance-vision:
      symbols:
        - BTCUSDT
        - ETHUSDT
        - BNBUSDT
        - SOLUSDT
        - TRXUSDT
        - DOGEUSDT
        - ZECUSDT
        - ADAUSDT
        - XMRUSDT
