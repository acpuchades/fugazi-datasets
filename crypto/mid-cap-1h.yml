name: crypto-mid-cap-1h
description: >
  Mid-cap crypto spot pairs vs. USDT on Binance, hourly bars.
  Tokens ranked 10-19 by market cap (non-stable, Binance-listed),
  complementing large-cap-1h for cross-sectional factor strategies.
  Selection is maintained automatically via `make update-selections`.
interval: 1h
sources:
  - binance-vision:
      symbols:
        - LINKUSDT
        - XLMUSDT
        - BCHUSDT
        - GRAMUSDT
        - LTCUSDT
        - HBARUSDT
        - SUIUSDT
        - AVAXUSDT
        - SHIBUSDT
        - XAUTUSDT
        - BTCUSDT   # anchor for btc_sharpe*; not a mid-cap constituent
