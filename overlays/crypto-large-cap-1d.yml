vr20: !variance_ratio { period: 20, lag: 5 }
autocorr20: !correlation
  lhs: !roc { periods: 1 }
  rhs: !lag { source: !roc { periods: 1 }, periods: 1 }
  period: 20
rvol20: !garman_klass { period: 20 }
kurt60: !kurtosis { period: 60 }
btc_sharpe365: !sharpe
  strategy:
    symbol: BTCUSDT
    long:
      enter: !value true
  period: 365
  bars_per_year: 365.0

# ── binance-vision side channels ──────────────────────────────────────────────
# Order flow, carry, open interest and positioning, from the futures/kline
# metrics binance-vision surfaces as overlay columns (read here via !get).
# Windows are in bars (daily), so ~8d carry and ~30d normalisation.
taker_buy_frac: !div { lhs: !get { key: taker_buy_base_volume }, rhs: !volume }
funding_mean8: !sma { source: !get { key: funding_rate }, period: 8 }
oi_roc5: !roc { source: !get { key: open_interest }, periods: 5 }
oi_z30: !zscore { source: !get { key: open_interest }, period: 30 }
ls_z30: !zscore { source: !get { key: long_short_ratio }, period: 30 }
