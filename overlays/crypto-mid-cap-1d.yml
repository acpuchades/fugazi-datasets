vr20: !variance_ratio { period: 20, lag: 5 }
autocorr20: !correlation
  lhs: !roc { periods: 1 }
  rhs: !lag { source: !roc { periods: 1 }, periods: 1 }
  period: 20
rvol20: !garman_klass { period: 20 }
kurt60: !kurtosis { period: 60 }
# Reads BTCUSDT, which is not a mid-cap token — it rides along in the dataset as
# an anchor so this resolves, the same way SPY does for the equity sets. See the
# `# anchor` line in crypto/mid-cap-1d.yml.
btc_sharpe365: !sharpe
  strategy:
    symbol: BTCUSDT
    long:
      enter: !value true
  period: 365
  bars_per_year: 365.0

# ── binance-vision spot side channels ─────────────────────────────────────────
# The kline's own order-flow extras, read here via !get. Nothing derivative:
# these are properties of the spot bar itself.
taker_buy_frac: !div { lhs: !get { key: taker_buy_base_volume }, rhs: !volume }
avg_trade_size: !div { lhs: !volume, rhs: !get { key: n_trades } }
bar_vwap: !div { lhs: !get { key: quote_volume }, rhs: !volume }
