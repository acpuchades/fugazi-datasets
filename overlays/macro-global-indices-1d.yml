vr20: !variance_ratio { period: 20, lag: 5 }
autocorr20: !correlation
  lhs: !roc { periods: 1 }
  rhs: !lag { source: !roc { periods: 1 }, periods: 1 }
  period: 20
rvol20: !garman_klass { period: 20 }
kurt60: !kurtosis { period: 60 }
sp500_sharpe252: !sharpe
  strategy:
    symbol: "^GSPC"
    long:
      enter: !value true
  period: 252
  bars_per_year: 252.0

corr_to_spy: !correlation
  lhs: !roc { periods: 1 }
  rhs: !roc { periods: 1, source: !close { source: !pick { symbol: SPY } } }
  period: 60
beta_to_spy: !mul
  lhs: !correlation
    lhs: !roc { periods: 1 }
    rhs: !roc { periods: 1, source: !close { source: !pick { symbol: SPY } } }
    period: 60
  rhs: !div
    lhs: !stddev { source: !roc { periods: 1 }, period: 60 }
    rhs: !stddev { source: !roc { periods: 1, source: !close { source: !pick { symbol: SPY } } }, period: 60 }
